stages:
  - test
  - build
  - run
  - delete

variables:
  IMAGE: "helloworld:latest"
  CONTAINER_NAME: "helloworld-container"

default:
  before_script:
    - whoami

test-application:
  stage: test
  tags:
    - docker
  script:
    - echo "Testing the application..."
    - whoami

security-scan:
  stage: test
  tags:
    - docker
  script:
    - echo "Performing security scan..."
    - whoami

build-image:
  only:
    - main
  stage: build
  tags:
    - ubuntu
  script:
    - echo "Building the Docker image..."
    - docker build -t $IMAGE application


run-image:
  stage: delete
  tags:
    - ubuntu
  needs:
    - build-image
  script:
    - echo "Running the Docker image..."
    - docker run --name $CONTAINER_NAME $IMAGE
    - docker logs $CONTAINER_NAME


delete-container:
  stage: run
  tags:
    - ubuntu
  needs:
    - build-image
  script:
    - echo "Removing the Docker container..."
    - docker rm -f $CONTAINER_NAME