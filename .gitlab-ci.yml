stages:
  - test
  - build
  - run

variables:
  IMAGE: "helloworld:latest"

default:
  before_script:
    - whoami

test-application:
  stage: test
  tags:
    - docker
  script:
    - echo "Testing the application..."
    - whoami

build-image:
  only:
    - main
  stage: build
  tags:
    - ubuntu
  script:
    - echo "Building the Docker image..."
    - docker build -t $IMAGE application


run-image:
  stage: run
  tags:
    - ubuntu
  needs:
    - build-image
  script:
    - echo "Running the Docker image..."
    - docker run --name helloworld-container $IMAGE