stages:
  - build
  - run

variables:
  IMAGE: "helloworld:latest"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"

default:
  image: docker:27
  tags:
    - ubuntu
  services:
    - docker:27-dind
  before_script:
    - echo "hello $NAME"

build-image:
  stage: build
  image: docker:27-dind
  tags:
    - ubuntu
  script:
    - docker build -f application/docker/Dockerfile -t "$IMAGE" application/docker
    - docker run --rm "$IMAGE"


run-image:
  stage: run
  tags:
    - ubuntu
  script:
    - echo "Running the Docker image..."