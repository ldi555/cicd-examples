name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions
env:
  VERSION: "2.01"
  IMAGE: "helloworld:latest"
  CONTAINER_NAME: "helloworld-container"
on: [push]
jobs:
  Execute-HelloWorld-on-Github-Runner:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello ${{ vars.NAME }}"
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "The workflow is now ready to test your code on the runner."
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }} ${{ github.workspace }}/application
      - name: Run Docker container
        run: docker run --name ${{ env.CONTAINER_NAME }} ${{ env.IMAGE }}
      - name: Display container logs
        run: docker logs ${{ env.CONTAINER_NAME }}
      - name: Delete Docker container
        run: docker rm -f ${{ env.CONTAINER_NAME }}
      - name: Display job status
        run: echo "This job's status is ${{ job.status }}."
  Execute-HelloWorld-on-ec2-runner:
    runs-on: self-hosted
    steps:
      - run: echo "Hello ${{ vars.NAME }}"
      - run: whoami
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "The workflow is now ready to test your code on the runner."
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }} ${{ github.workspace }}/application
      - name: Run Docker container
        run: docker run --name ${{ env.CONTAINER_NAME }} --rm ${{ env.IMAGE }}
      - name: Display container logs
        run: docker logs ${{ env.CONTAINER_NAME }}
      - name: Delete Docker container
        run: docker rm -f ${{ env.CONTAINER_NAME }}
      - name: Display job status
        run: echo "This job's status is ${{ job.status }}."